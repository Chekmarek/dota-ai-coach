# Выпуск релиза из исходников (ветка sources).
# При каждом push в sources смотрит version в package.json. Если релиза v<версия> ещё нет —
# собирает коуча на Windows (npm run dist), проверяет типы и тесты и публикует релиз:
#   app.asar + app.asar.sha256  — для автообновления внутри коуча (вкладка «Обновления»);
#   DotaCoach-Setup-<версия>.exe и portable.zip — для первой установки.
# Если версия не поменялась, ничего не происходит. Выпустить новую версию = поднять version и запушить.
name: release-sources
on:
  push:
    branches: [sources]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-sources
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # .npmrc проекта указывает кэш на диск разработчика — в CI кэш во временной папке
      - name: Кэш npm во временной папке
        run: '"npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV'
      - name: Версия
        id: v
        run: |
          $ver = node -p "require('./package.json').version"
          "tag=v$ver" >> $env:GITHUB_OUTPUT
          "ver=$ver" >> $env:GITHUB_OUTPUT
      - name: Релиз уже есть?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.v.outputs.tag }}" *> $null
          if ($LASTEXITCODE -eq 0) { "yes=1" >> $env:GITHUB_OUTPUT; "Релиз ${{ steps.v.outputs.tag }} уже есть — выпускать нечего" } else { "yes=0" >> $env:GITHUB_OUTPUT }
          exit 0
      - name: Зависимости
        if: steps.exists.outputs.yes == '0'
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Проверки (типы и unit-тесты)
        if: steps.exists.outputs.yes == '0'
        run: |
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Сборка (установщик, zip, app.asar)
        if: steps.exists.outputs.yes == '0'
        run: npm run dist
      - name: Файлы релиза
        if: steps.exists.outputs.yes == '0'
        run: |
          $ver = "${{ steps.v.outputs.ver }}"
          $src = "release/$ver"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$src/win-unpacked/resources/app.asar" dist/app.asar
          $hash = (Get-FileHash dist/app.asar -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/app.asar.sha256", "$hash  app.asar`n")
          Copy-Item "$src/DotaCoach-Setup-$ver.exe", "$src/DotaCoach-$ver-win-x64-portable.zip" dist/
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} МБ" -f $_.Name, ($_.Length / 1MB) }
          "sha256 app.asar: $hash"
      - name: Публикация релиза
        if: steps.exists.outputs.yes == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.v.outputs.tag }}"
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { New-Item -ItemType Directory -Force docs/release-notes | Out-Null; "Обновление $tag" | Set-Content -Encoding utf8 $notes }
          gh release create $tag (Get-ChildItem dist).FullName --target $env:GITHUB_SHA --title $tag --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
